<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Fruit Parallax</title>
  <link rel="stylesheet" href="task2.css">
  <script src="task2.js"></script>
</head>

<body>
  <section class="layer layer-1" data-parallax="0.5"
    style="background-image: url('https://www.sjchs.org/images/default-source/blogs/fruits_main.jpg?sfvrsn=8968415a_0') ;">
    <h1>Fruits</h1>
  </section>
  <!-- <section class="color-section" style="background-color: white">
        <p>fruits galore</p>
      </section>
       -->
  <section class="color-section" style="background-color: red;">
    <p>Strawberries</p>
  </section>
  <section class="parallax" data-parallax="0.5"
    style="background-image: url('https://static.scientificamerican.com/sciam/cache/file/78BE16E0-9E47-4163-BDFE6E11CE52B580_source.jpg?crop=1%3A1%2Csmart&w=1000');">
  </section>

  <section class="color-section" style="background-color: orange;">
    <p>Oranges </p>
  </section>
  <section class="parallax" data-parallax="0.5"
    style="background-image: url('https://www.allrecipes.com/thmb/y_uvjwXWAuD6T0RxaS19jFvZyFU=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/GettyImages-1205638014-2000-d0fbf9170f2d43eeb046f56eec65319c.jpg');">
  </section>

  <section class="color-section" style="background-color: rgba(243, 243, 42, 0.925);">
    <p>Bananas</p>
  </section>
  <section class="parallax" data-parallax="0.5"
    style="background-image: url('https://hips.hearstapps.com/hmg-prod/images/ripe-yellow-bananas-at-the-shopping-market-fruits-royalty-free-image-1712833209.jpg');">
  </section>

  <section class="color-section" style="background-color: rgba(171, 234, 100, 0.925);">
    <p>Apples</p>
  </section>
  <section class="parallax" data-parallax="0.5"
    style="background-image: url('https://images.pexels.com/photos/693794/pexels-photo-693794.jpeg');">
  </section>
  <section class="color-section" style="background-color: rgba(68, 73, 221, 0.925);">
    <p>Blueberries</p>
  </section>
  <section class="parallax" data-parallax="0.5"
    style="background-image: url('  https://media.post.rvohealth.io/wp-content/uploads/2020/08/blueberries_fresh_fullframe_732x549_thumb-732x549.jpg');">
  </section>

  <section class="color-section" style="background-color: purple;">
    <p>Grapes </p>
  </section>
  <section class="parallax" data-parallax="0.5"
    style="background-image: url('https://www.lovethegarden.com/sites/default/files/styles/large/public/content/plants/grapes%20preview%20%281%29.jpg?itok=MF-GHbs7');">
  </section>

  




</body>

</html>
