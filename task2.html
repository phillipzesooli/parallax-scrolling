<!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8">
        <title>Fruit Parallax</title>
        <link rel="stylesheet" href="task2.css">
        <script src="task2.js"></script>
      </head>
      <body>
        <section class="layer layer-1" data-parallax="0.5" style="background-image: url('https://www.sjchs.org/images/default-source/blogs/fruits_main.jpg?sfvrsn=8968415a_0') ;">
        <h1>Fruits</h1>
      </section>
      <section class="color-section" style="background-color: white">
        <p>fruits galore</p>
      </section>
      
        <section class="parallax" data-parallax="0.5" style="background-image: url('https://hips.hearstapps.com/hmg-prod/images/apples-at-farmers-market-royalty-free-image-1627321463.jpg?crop=0.796xw:1.00xh;0.103xw,0&resize=640:*');">
          <h1>Apple</h1>
        </section>
        <section class="color-section" style="background-color: red;">
          <p>Apples</p>
        </section>
      
        <section class="parallax" data-parallax="0.5" style="background-image: url('https://www.allrecipes.com/thmb/y_uvjwXWAuD6T0RxaS19jFvZyFU=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/GettyImages-1205638014-2000-d0fbf9170f2d43eeb046f56eec65319c.jpg');">
          <h1>Orange</h1>
        </section>
        <section class="color-section" style="background-color: orange;">
          <p>Oranges </p>
        </section>
      
        <section class="parallax" data-parallax="0.5" style="background-image: url('https://www.thespruceeats.com/thmb/l1_lV7wgpqRArWBwpG3jzHih_e8=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/what-are-grapes-5193263-hero-01-80564d77b6534aa8bfc34f378556e513.jpg');">
          <h1>Grapes</h1>
        </section>
        <section class="color-section" style="background-color: purple;">
          <p>Grapes </p>
        </section>

        <section class="parallax" data-parallax="0.5" style="background-image: url('https://hips.hearstapps.com/hmg-prod/images/ripe-yellow-bananas-at-the-shopping-market-fruits-royalty-free-image-1712833209.jpg');">
          <h1>Bananas</h1>
        </section>
        <section class="color-section" style="background-color: yellow;">
          <p>Bananas</p>
          </section>

      
      
      </body>
      </html>
